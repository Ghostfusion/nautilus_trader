[package]
name = "nautilus-research"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Point-in-time research datasets for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_research"
crate-type = ["rlib"]

[features]
default = []
extension-module = [
  "nautilus-core/extension-module",
  "nautilus-model/extension-module",
  "nautilus-persistence/extension-module",
  "python",
  "pyo3/extension-module",
]
python = [
  "nautilus-core/python",
  "nautilus-model/python",
  "nautilus-persistence/python",
  "pyo3",
  "pyo3-stub-gen",
]

[[bench]]
name = "membership_backfill"
path = "benches/membership_backfill.rs"
harness = false

[package.metadata.cargo-machete]
ignored = ["arrow"] # Used by `arrow_custom_data` macro expansion

[dependencies]
nautilus-core = { workspace = true }
nautilus-model = { workspace = true }
nautilus-persistence = { workspace = true }
nautilus-serialization = { workspace = true, features = ["arrow"] }

anyhow = { workspace = true }
arrow = { workspace = true } # Used by `arrow_custom_data` macro expansion
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
tempfile = { workspace = true }
